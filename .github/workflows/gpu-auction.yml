name: GPU auction

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_gpu:
        description: Run on a provisioned NVIDIA GPU runner with cuOpt 26.08
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          # Pinned fixtures are tracked under test/veil and verified by PIN.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '23.10.0'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ripgrep tcc
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz -o /tmp/binaryen.tar.gz
          echo '0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc  /tmp/binaryen.tar.gz' | sha256sum -c -
          mkdir -p "$HOME/.local/binaryen"
          tar -xzf /tmp/binaryen.tar.gz --strip-components=1 -C "$HOME/.local/binaryen"
          echo "$HOME/.local/binaryen/bin" >> "$GITHUB_PATH"
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.1/wasmtime-v48.0.1-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
          echo '4c2e31b68ad99e0a519f225a261fda099eb15f056d4a24fdb3c2a46517bde1df  /tmp/wasmtime.tar.xz' | sha256sum -c -
          mkdir -p "$HOME/.local/wasmtime"
          tar -xJf /tmp/wasmtime.tar.xz --strip-components=1 -C "$HOME/.local/wasmtime"
          echo "$HOME/.local/wasmtime" >> "$GITHUB_PATH"
          python -m pip install '.[test]'
      - name: Verify the C toolchain
        run: |
          tcc -v
          wasm-opt --version | rg '^wasm-opt version 130( |$)'
          wasmtime --version | rg '^wasmtime 48\.0\.1 '
      - name: Build the mechanism compiler and certificate checker
        run: make c-build
      - name: Pin and C regression suites
        run: |
          zsh dev/gates.sh --leg pin
          templates=$(_tcc/surface_shape_metadata)
          printf '%s\n' "$templates"
          [ "$templates" = 'VEIL-TEMPLATES OK shapes=4' ]
          bounds=$(_tcc/wasm_circuit_bounds | tail -1)
          printf '%s\n' "$bounds"
          [ "$bounds" = 'CIRCUIT-BOUNDS 18/18' ]
          _tcc/kernel_protocol test/veil/test
          levels=$(_tcc/levels_protocol)
          printf '%s\n' "$levels"
          [ "$levels" = 'LEVELS-RUNTIME-OK algebra=19 checker=23 poly=12 boundary_cases=1' ]
          python3 -I test/protocols/levels_protocol_boundaries.py
      - name: Auction and certificate checks
        run: python -P dev/gpu-auction-check.py --category --schemas --record auction-validation.json
      - name: Installed CLI round trip
        run: |
          mech-cuopt export examples/combinatorial/three-bidders.json --out /tmp/mig-model
          mech-cuopt solve /tmp/mig-model --backend reference --out /tmp/mig-settlement
          mech-cuopt audit /tmp/mig-model /tmp/mig-settlement

  live-gpu:
    if: github.event_name == 'workflow_dispatch' && inputs.live_gpu
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The runner supplies Python >=3.11, zsh, tcc, Node 23.10,
      # and cuOpt 26.08 configured for its NVIDIA driver/CUDA.
      - run: tcc -v
      - run: make c-build
      - run: python3 -m pip install --no-deps .
      - run: python3 -P dev/gpu-auction-check.py --gpu --record auction-gpu-validation.json
